[global]
transports=sips:sip.coolnik.ru:5061;maddr=132.243.19.199 sip:127.0.0.1:5060;transport=tcp
aliases=sip.coolnik.ru 132.243.19.199
log-directory=/var/opt/belledonne-communications/log/flexisip
log-level=message
syslog-level=error
user-errors-logs=true
tls-certificates-file=/etc/letsencrypt/live/sip.coolnik.ru/fullchain.pem
tls-certificates-private-key=/etc/letsencrypt/live/sip.coolnik.ru/privkey.pem

[module::DoSProtection]
# Public filtering is enforced by the host firewall. The container intentionally
# has no NET_ADMIN capability and must not change the server-wide ruleset.
enabled=false

[module::Authentication]
enabled=true
auth-domains=sip.coolnik.ru
realm=sip.coolnik.ru
available-algorithms=SHA-256
db-implementation=file
file-path=/run/secrets/users.conf

[module::Registrar]
enabled=true
reg-domains=sip.coolnik.ru
max-contacts-by-aor=12
max-expires=604800
db-implementation=redis
redis-server-domain=127.0.0.1
redis-server-port=6381

[module::Router]
enabled=true
fork-late=true
message-delivery-timeout=604800

[module::PushNotification]
enabled=true
timeout=0
apple=false
firebase=true
firebase-service-accounts=634323243651:/run/secrets/firebase-service-account.json
register-wakeup-interval=30
register-wakeup-threshold=50

[module::MediaRelay]
enabled=true
sdp-port-range=10000-10199
force-public-ip-for-sdp-masquerading=true
